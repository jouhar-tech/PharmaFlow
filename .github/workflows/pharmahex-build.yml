name: PharmaHex build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore .NET dependencies
        run: dotnet restore ./PharmaFlow/PharmaFlow.csproj

      - name: Build PharmaHex
        run: dotnet build ./PharmaFlow/PharmaFlow.csproj --configuration Release --no-restore

      - name: Check invoice capture JavaScript syntax
        run: node --check ./PharmaFlow/wwwroot/js/invoice-capture.js

      - name: Check Create Bill inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path("./PharmaFlow/Views/Billing/Create.cshtml").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, flags=re.DOTALL)
          if not scripts:
              raise SystemExit("Create.cshtml has no inline script block.")

          # Replace the three Razor-generated URL expressions with a valid JS string.
          script = scripts[-1]
          script = re.sub(r"@Url\.Action\([^)]*\)", '"/"', script)
          Path("/tmp/billing-create.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/billing-create.js
